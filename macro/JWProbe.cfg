#####################################################################
# UNIVERSAL SWITCHY, BED MESH, QGL, & AUTO-Z CONFIGURATION TEMPLATE
# Instructions: Adjust values in the variable blocks below for each printer.
#####################################################################

#####################################################################
# 1. PRINTER-SPECIFIC VARIABLE STORES
#####################################################################

[gcode_macro Homing_Variables]
# --- Hardware Geometry ---
variable_lift_z:                5.0  ; Vertical clearance lift distance before homing axes
variable_x_homing_pos:          124  ; Physical X coordinate of the Z-switch pin
variable_y_homing_pos:          188  ; Physical Y coordinate of the Z-switch pin
variable_z_end_pos:             5.0  ; Retract height above bed post-homing
variable_z_min_floor:          -3.0  ; Absolute lowest depth Z is allowed to travel for triggers
# --- Speeds & Currents ---
variable_xy_speed:              200  ; X/Y travel speed (mm/s)
variable_z_speed:               15   ; Homing Z speed (mm/s)
variable_x_current_multiplier:  .6   ; Low-torque current multiplier during X homing
variable_y_current_multiplier:  .5   ; Low-torque current multiplier during Y homing
gcode:
    # Empty block stub required for variable processing

[gcode_macro switchy_variables]
# --- Dock Mechanics ---
variable_deploy_pos:            176  ; X coordinate where toolhead picks up the probe
variable_retract_pos:             0  ; X coordinate where toolhead strips/docks the probe
variable_deploy_z:               10  ; Clearance height for dock engagement
# --- Safety Transit Zones ---
variable_safe_x:                 90  ; Safe resting center point X for the printer bed
variable_safe_y:                 90  ; Safe resting center point Y for the printer bed
# --- Geometric Restrictive Boundaries (180x180 Bed Example) ---
variable_mesh_min_x:             20  ; Restricted mesh left boundary
variable_mesh_min_y:             46  ; Restricted mesh front boundary (incorporates probe offset)
variable_mesh_max_x:            160  ; Restricted mesh right boundary
variable_mesh_max_y:            144  ; Restricted mesh back boundary (incorporates probe offset)
variable_qgl_point1_x:           20  ; QGL Front-Left X point
variable_qgl_point1_y:           20  ; QGL Front-Left Y point
variable_qgl_point2_x:           20  ; QGL Rear-Left X point
variable_qgl_point2_y:          134  ; QGL Rear-Left Y point
variable_qgl_point3_x:          160  ; QGL Rear-Right X point
variable_qgl_point3_y:          134  ; QGL Rear-Right Y point
variable_qgl_point4_x:          160  ; QGL Front-Right X point
variable_qgl_point4_y:           20  ; QGL Front-Right Y point
gcode:
    # Empty block stub required for variable processing

#####################################################################
# 2. CORE STEPPER Z CONFIGURATION
#####################################################################

[stepper_z]
# ... (Keep your existing step_pin, dir_pin, enable_pin, rotation_distance, etc.) ...
endstop_pin: PC3                     ; Physical Auto-Z Switch GPIO pin
position_endstop: -0.5               ; Initial baseline offset value for Z switch homing
position_max: 150                    ; Maximum vertical physical travel limit of gantry frame
position_min: -3.0                   ; Set to match variable_z_min_floor to avoid out-of-range crashes
homing_speed: 15                     ; Safe vertical homing approach speed (mm/s)
second_homing_speed: 5               ; Ultra-fine homing contact speed (mm/s)
homing_retract_dist: 0               ; Disabled to allow plugin to control switch cycles
homing_retract_speed: 5              ; Lift velocity after homing contact (mm/s)

#####################################################################
# 3. CORE HARDWARE PROBE SPECIFICATION
#####################################################################

[probe]
pin: ^nhk:gpio10                     ; UPDATE THIS: Hardware toolhead probe signal input pin
x_offset: 0                          ; Horizontal distance from nozzle tip to probe center
y_offset: 26.0                       ; Vertical depth distance from nozzle tip to probe center
speed: 15                            ; Standard vertical probing velocity (mm/s)
samples: 3                           ; Number of probe drops per calculation node
samples_result: median               ; Selects middle value to filter out electronic noise
sample_retract_dist: 2.0             ; Upward separation distance between sample readings
samples_tolerance: 0.009             ; Maximum allowed variance deviation between samples
samples_tolerance_retries: 7         ; Allowable measurement retry loops on failure

#####################################################################
# 4. LEVELING & SURFACE COMPENSATION MAPS
#####################################################################

[bed_mesh]
zero_reference_position: 90, 90      ; Dynamically syncs with absolute physical center midpoint
speed: 200                           ; Translation velocity across independent mesh nodes (mm/s)
horizontal_move_z: 5                 ; Inter-node Z-hop safety plane travel height
mesh_min: 20, 46                     ; Pulled directly from template variables above
mesh_max: 160, 144                   ; Pulled directly from template variables above
probe_count: 3, 3                    ; Array configuration layout matrix dimensions
algorithm: lagrange                   ; Mathematical map curve smoothing computation setting
fade_start: 1.0                      ; Mesh compensation attenuation initialization elevation
fade_end: 10.0                       ; Compensation curve complete zero-out target roof point
fade_target: 0.0                     ; Correction vector offset goal after fade completes
adaptive_margin: 5                   ; Bounding dynamic expansion safety border radius padding

[quad_gantry_level]
gantry_corners:
   -50.2, -5.4                       ; Front-Left frame belt/stepper intersection point reference
   135, 90                           ; Rear-Right frame belt/stepper intersection point reference
points:
   # Leveling target coordinate maps pulled from your safety layout parameters
   20, 20                            ; Front-Left
   20, 134                           ; Rear-Left 
   160, 134                          ; Rear-Right
   160, 20                           ; Front-Right
speed: 300                           ; Inter-station translation transit velocity (mm/s)
horizontal_move_z: 3                 ; Safe Z elevation kept during translation moves
retries: 5                          ; Maximum verification loop correction iterations allowed
retry_tolerance: 0.005               ; Max variance alignment resolution floor pass limit
max_adjust: 10                       ; Total absolute physical adjustment step ceiling cap limit

#####################################################################
# ALTERNATIVE: Z-TILT ADJUSTMENT (Commented Default Template)
# Use this section INSTEAD of [quad_gantry_level] if your printer has 2 or 3 Z-motors
#####################################################################

#[z_tilt]
#z_positions:
#   -50, 90                           ; Physical pivot point for Left Z stepper motor (X, Y)
#   230, 90                           ; Physical pivot point for Right Z stepper motor (X, Y)
#points:
#   20, 90                            ; Safe probing point near the Left edge of the bed (X, Y)
#   160, 90                           ; Safe probing point near the Right edge of the bed (X, Y)
#speed: 300                           ; Inter-station translation transit velocity (mm/s)
#horizontal_move_z: 3                 ; Safe vertical clearance plane kept during translation moves
#retries: 5                           ; Maximum verification loop correction iterations allowed
#retry_tolerance: 0.01                ; Standardized target alignment resolution pass limit (10 microns)
#max_adjust: 10                       ; Total absolute physical adjustment

#####################################################################
# 5. HOMING OVERRIDE (Low-Torque Dynamic Logic)
#####################################################################

[homing_override]
axes: xyz                            
set_position_z: 0                    
gcode:
    {% set Lz = printer["gcode_macro Homing_Variables"].lift_z %}
    {% set Hx = printer["gcode_macro Homing_Variables"].x_homing_pos %}
    {% set Hy = printer["gcode_macro Homing_Variables"].y_homing_pos %}
    {% set Ez = printer["gcode_macro Homing_Variables"].z_end_pos %}
    {% set Sxy = printer["gcode_macro Homing_Variables"].xy_speed * 60 %}
    {% set Sz = printer["gcode_macro Homing_Variables"].z_speed * 60 %}
    {% set HcX = printer["gcode_macro Homing_Variables"].x_current_multiplier|float %}
    {% set HcY = printer["gcode_macro Homing_Variables"].y_current_multiplier|float %}
    {% set no_params = not('X' in params or 'Y' in params or 'Z' in params) %}

    # Pull current settings dynamically based on active stepper drivers configured
    {% set x_run_current = printer.configfile.settings["tmc5160 stepper_x"].run_current | float %}
    {% set y_run_current = printer.configfile.settings["tmc5160 stepper_y"].run_current | float %}

    # Safe relative lift clear of bed before horizontal homing moves
    G91                              
    G1 Z{Lz} F{Sz}                   
    G90                              

    # Home X Axis (Low Torque)
    {% if 'X' in params or no_params %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run_current * HcX} 
        G28 X                        
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run_current} 
    {% endif %}
    
    # Home Y Axis (Low Torque)
    {% if 'Y' in params or no_params %}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run_current * HcY} 
        G28 Y                        
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run_current} 
    {% endif %}
    
    # Home Z Axis (Over Physical Switch Pin Location)
    {% if 'Z' in params or no_params %}
        G1 X{Hx} Y{Hy} F{Sxy}
        G28 Z
        G1 Z{Ez} F{Sz}
    {% endif %}

#####################################################################
# 6. AUTO-Z PLUGIN CONFIGURATION
#####################################################################

[z_calibration]
nozzle_xy_position: 124, 188         ; Core Z-switch hardware pin location (Nozzle Center)
switch_xy_position: 124, 162.0       ; Core Z-switch hardware pin location (Probe Center)
bed_xy_position: 10, 46              ; Calibration tap point (Nozzle coordinates)
switch_xy_offsets: 0,0               ; Bypasses auto-shifting plugin bugs completely

# Structural Boundary Safety Settings
safe_z_height: 5.0                   ; Travel height during calibration transit steps
position_min: -3.0                   ; Set to match variable_z_min_floor to allow deep switch compression
probing_first_fast: false            ; Slow precision drop method on first cycle pass

# Tuning Factors
switch_offset: 0.5                   ; Base compression constant factor
offset_margins: -1.0,1.0             ; Maximum allowed safety calculation variance window
speed: 100                           ; Fast move speed (mm/s)
probing_speed: 5                     ; Probing approach speed (mm/s)
probing_second_speed: 2              ; Fine probing click verification speed (mm/s)
probing_retract_dist: 2              ; Distance lifted between calculation taps
start_gcode: DEPLOY_PROBE            ; Wrapper hook deployed before plugin tasks start
# Note: end_gcode is intentionally omitted to avoid premature runaway travel moves

#####################################################################
# 6. MODULARIZED SWITCHY / PROBE MACROS
#####################################################################

[gcode_macro DEPLOY_PROBE]
description: Universal probe pickup sequence
gcode:
    {% set sv = printer["gcode_macro switchy_variables"] %}
    {% set Sz = printer["gcode_macro Homing_Variables"].z_speed * 60 %}
    {% set Sxy = printer["gcode_macro Homing_Variables"].xy_speed * 60 %}
    
    G91                              
    G1 Z5 F{Sz}                       
    G90                              
    
    M117 Deploying Probe...
    G1 X{sv.deploy_pos} F{Sxy}       ; Travel directly into the deployment dock
    G1 Z{sv.deploy_z} F{Sz}          ; Drop down mechanically to attach magnetic anchors
    
    # Clean exit back to safe resting coordinate zones
    G1 X{sv.safe_x} Y{sv.safe_y} F{Sxy}            
    G1 Z5 F{Sz}                       

[gcode_macro RETRACT_PROBE]
description: Universal probe stripping/docking sequence
gcode:
    {% set sv = printer["gcode_macro switchy_variables"] %}
    {% set Sz = printer["gcode_macro Homing_Variables"].z_speed * 60 %}
    {% set Sxy = printer["gcode_macro Homing_Variables"].xy_speed * 60 %}
    
    G91                              
    G1 Z5 F{Sz}                       
    G90                              
    
    M117 Retracting Probe...
    G1 X{sv.retract_pos} F{Sxy}      ; Travel to stripping/separation block station
    G1 Z10 F{Sz}                     ; Lift toolhead straight up to split magnets apart
    G4 P2000                         ; Dwell 2 seconds to guarantee complete separation clearance
    
    # Return nozzle safely out of way of tool changer rails
    G1 X{sv.safe_x} Y{sv.safe_y} F{Sxy}            
    G1 Z5 F{Sz}                       

[gcode_macro CALIBRATE_Z]
rename_existing: BASE_CALIBRATE_Z
description: Safe, edge-restricted execution wrapper for calibration
gcode:
    G90                              
    M117 Calibrating Z...
    BASE_CALIBRATE_Z                 ; Executes taps safely while keeping probe attached
    RETRACT_PROBE                    ; Permanently prevents premature X0 movement by docking only when done
    M117 Z Calibration Complete

[gcode_macro COMPUTE_OFFSET_DIFFERENCE]
description: Utility command to compute and debug nozzle-to-bed math
gcode:
    G28                              
